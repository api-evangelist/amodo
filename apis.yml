name: Amodo
description: >-
  Amodo was a European connected-insurance and telematics company founded in Zagreb, Croatia,
  that helped insurers and brokers build and distribute personalized usage-based insurance (UBI)
  products. Its Connected Insurance Platform combined a mobile telematics SDK, driver-behavior
  scoring, customer segmentation, and profiling analytics to power models ranging from
  try-before-you-buy to pay-as-you-drive and pay-per-mile. Over roughly nine years Amodo ran
  nearly 50 telematics programs worldwide with insurers including AIG, Porsche Versicherungs,
  Tower Insurance, and P&V, and was named one of the Financial Times' top five insurtech
  companies. Backed by Speedinvest, Amodo was acquired by Cambridge Mobile Telematics (CMT) in
  March 2023 and folded into CMT's European operations; the amodo.eu domain now redirects to
  CMT, and the company no longer maintains an independent public developer or API surface.
